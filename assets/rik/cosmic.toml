# Generated by cosmic-export -- see home/modules/desktop-integration/cosmic-snapshot.nix.
# Re-export rather than hand-editing where possible.

"$schema" = "https://raw.githubusercontent.com/cosmic-utils/cosmic-ctl/refs/heads/main/schema.json"

[[operations]]
component = "com.system76.CosmicAppList"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
enable_drag_source = "true"
favorites = """
[
    \"firefox\",
    \"zen-beta\",
    \"com.system76.CosmicFiles\",
    \"com.system76.CosmicSettings\",
    \"kitty\",
    \"thunderbird\",
]"""
filter_top_levels = "None"

[[operations]]
component = "com.system76.CosmicAppletTime"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
first_day_of_week = "6"
military_time = "false"

[[operations]]
component = "com.system76.CosmicBackground"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
same-on-all = "true"

[[operations]]
component = "com.system76.CosmicComp"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
autotile = "true"
autotile_behavior = "PerWorkspace"
focus_follows_cursor = "true"
input_touchpad = """
(
    state: Enabled,
    click_method: Some(Clickfinger),
    scroll_config: Some((
        method: Some(TwoFinger),
        natural_scroll: Some(true),
        scroll_button: None,
        scroll_factor: None,
    )),
    tap_config: Some((
        enabled: true,
        button_map: Some(LeftRightMiddle),
        drag: true,
        drag_lock: false,
    )),
)"""
xkb_config = """
(
    rules: \"\",
    model: \"pc104\",
    layout: \"us\",
    variant: \"\",
    options: Some(\"terminate:ctrl_alt_bksp,compose:ralt\"),
    repeat_delay: 600,
    repeat_rate: 25,
)"""

[[operations]]
component = "com.system76.CosmicFiles"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
desktop = """
(
    grid_spacing: 100,
    icon_size: 100,
    show_content: true,
    show_mounted_drives: false,
    show_trash: false,
)"""

[[operations]]
component = "com.system76.CosmicIdle"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
screen_off_time = "Some(1800000)"
suspend_on_ac_time = "None"
suspend_on_battery_time = "Some(1800000)"

[[operations]]
component = "com.system76.CosmicPanel"
version = 1
operation = "write"
xdg_directory = "config"

[operations.entries]
entries = """
[
    \"Panel\",
    \"Dock\",
]"""

