[osd]
follow_focused_output = true
monitors = [ "eDP-1" ]
scale = 0.5

    [osd.kinds]
    dnd = false
    keyboard_backlight = false
    nightlight = false
    privacy = false

[plugin_settings."avivbintangaringga/nix-monitor"]
panel_open_near_click = false
panel_placement = "floating"
show_update_check_notification = true
update_command = "cd /home/rik/Projects/datum/datum-config/ && ./deploy.sh"

[plugin_settings."mindnbytes/nix-status"]
details_position = "center"
flake_dir = "/home/rik/Projects/datum/datum-config"
nixos_configuration = "datum"

[plugins]
enabled = [
    "avivbintangaringga/nix-monitor",
    "mindnbytes/nix-status",
    "noctalia/umbriel-companion",
    "pulser/hover-widgets",
    "tordex/xwayland"
]

[shell]
corner_radius_scale = 0.25
font_family = "Lilex Nerd Font Medium"
polkit_agent = true
settings_show_advanced = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.animation]
    enabled = false

    [shell.launcher]
    app_grid = false
    categories = true
    default_view = "recent"
    layout = "full"
    search_position = "bottom"
    show_app_actions = true
    show_session_button = true
    show_settings_button = true
    track_usage = true
    width = 760

    [shell.panel]
    control_center_placement = "floating"

    [shell.screen_corners]
    enabled = true
    size = 4

[theme]
builtin = "Catppuccin"
community_palette = "Noctalia legacy"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "kitty", "starship", "umbriel" ]
    community_ids = [
        "zen-browser",
        "zathura",
        "yazi",
        "thunderbird",
        "libreoffice",
        "glow",
        "fzf",
        "fastfetch",
        "claude-code",
        "bat"
    ]

[wallpaper]
directory = "/home/rik/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/rik/Pictures/wallpapers/cities-05.jpg"

    [wallpaper.last]
    path = "/home/rik/Pictures/wallpapers/cities-05.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/rik/Pictures/wallpapers/cities-05.jpg"

[weather]
unit = "imperial"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.bar_2]
hide_on_wayland = false
type = "tordex/xwayland:bar"

[widget.clock]
scale = 1.1500000000000001

[widget.clock_2]
scale = 1.1500000000000001
type = "pulser/hover-widgets:clock"

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.nix_monitor_2]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.nix_monitor_3]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.status]
type = "mindnbytes/nix-status:status"

[widget.status_2]
type = "mindnbytes/nix-status:status"

[widget.status_3]
type = "mindnbytes/nix-status:status"

[widget.taskbar]
icon_scale = 1.1000000000000001
