[accessibility]
ui_scale = 1.75

[bar]
order = [ "default", "Nix" ]

    [bar.Nix]
    capsule = true
    capsule_border = "tertiary"
    capsule_fill = "surface"
    center = [ "status_2", "spacer_2", "nix_monitor_2" ]
    concave_edge_corners = false
    enabled = true
    end = []
    margin_ends = 10
    position = "bottom"
    reserve_space = false
    smart_auto_hide = true
    start = []

    [bar.default]
    capsule = true
    capsule_border = "tertiary"
    capsule_border_width = 0.5
    capsule_fill = "on_primary"
    capsule_foreground = "secondary"
    center = []
    contact_shadow = true
    end = [
        "group:g1",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "weather",
        "session"
    ]
    margin_edge = 6
    margin_ends = 10
    radius = 4
    scale = 1.00
    shadow = false
    start = [ "group:g2", "wallpaper", "workspaces", "taskbar" ]
    thickness = 25

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "bar", "media" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "tertiary"
        border_width = 0.5
        enabled = true
        fill = "on_primary"
        foreground = "secondary"
        id = "g2"
        members = [ "control-center", "launcher" ]
        opacity = 1.0
        padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 72.0
    box_width = 144.0
    cx = 2100.5
    cy = 93.5
    output = "eDP-1"
    placement_height = 1234.0
    placement_width = 2194.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        clock_style = "digital"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "Great Barrington, MA, USA"

[lockscreen]
allow_empty_password = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 681.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1097.0
    cy = 1097.0
    output = "eDP-1"
    placement_height = 1234.0
    placement_width = 2194.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
scale = 0.5

    [osd.kinds]
    dnd = false
    keyboard_backlight = false
    nightlight = false
    privacy = false

[plugin_settings."avivbintangaringga/nix-monitor"]
panel_open_near_click = false
panel_placement = "floating"
show_update_check_notification = true
update_command = "cd /home/rik/Projects/datum/datum-config/ && ./deploy.sh"

[plugin_settings."mindnbytes/nix-status"]
details_position = "center"
flake_dir = "/home/rik/Projects/datum/datum-config"
nixos_configuration = "datum"

[plugins]
enabled = [ "avivbintangaringga/nix-monitor", "mindnbytes/nix-status", "noctalia/umbriel-companion" ]

[shell]
corner_radius_scale = 0.25
font_family = "Lilex Nerd Font Medium"
settings_show_advanced = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.animation]
    enabled = false

    [shell.panel]
    control_center_placement = "floating"

    [shell.screen_corners]
    enabled = true
    size = 4

    # next section added by rik copying Noctalia docs
    [shell.launcher]
      layout = "full"
      width = 760
      search_position = "bottom"
      default_view = "recent"
      categories = true
      show_settings_button = true
      show_session_button = true
      app_grid = false
      track_usage = true

[theme]
builtin = "Catppuccin"
community_palette = "Tomorrow"
mode = "auto"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "helix", "kitty", "starship", "umbriel" ]
    community_ids = [ "zen-browser", "zed", "zathura", "yazi" ]

[wallpaper]
directory = "/home/rik/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/rik/Pictures/wallpapers/rose_pine.png"

    [wallpaper.last]
    path = "/home/rik/Pictures/wallpapers/rose_pine.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/rik/Pictures/wallpapers/rose_pine.png"

[weather]
unit = "imperial"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.nix_monitor_2]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.spacer_2]
type = "spacer"

[widget.status]
type = "mindnbytes/nix-status:status"

[widget.status_2]
type = "mindnbytes/nix-status:status"
