[accessibility]
ui_scale = 1.0000000074505806

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_border = "tertiary"
    capsule_border_width = 0.5
    capsule_fill = "on_primary"
    capsule_foreground = "secondary"
    center = [ "clock_2", "spacer_2", "taskbar" ]
    contact_shadow = true
    end = [
        "group:g1",
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "weather",
        "session"
    ]
    margin_edge = 6
    margin_ends = 10
    radius = 4
    scale = 1.0000000074505806
    shadow = false
    start = [ "launcher", "control-center", "wallpaper", "workspaces", "spacer_3", "nix_monitor_3", "status_3" ]
    thickness = 25

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "tertiary"
        border_width = 0.5
        enabled = true
        fill = "on_primary"
        foreground = "secondary"
        id = "g1"
        members = [ "bar", "bar_2" ]
        opacity = 1.0
        padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 72.0
    box_width = 144.0
    cx = 2100.5
    cy = 93.5
    output = "eDP-1"
    placement_height = 1234.0
    placement_width = 2194.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        clock_style = "digital"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 900.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 1200.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    resume_command = "umbriel-outputs-reset"
    timeout = 600.0

[location]
address = "Great Barrington, MA, USA"

