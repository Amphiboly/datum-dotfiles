[bar.default]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "weather",
    "session"
]
margin_edge = 6
margin_ends = 10
radius = 4
scale = 0.7500000037252903
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "taskbar" ]
thickness = 20

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Great Barrington, MA, USA"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 681.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
corner_radius_scale = 0.2500000037252903
font_family = "JetBrainsMonoNL NFP Medium"
settings_show_advanced = true
telemetry_enabled = true
ui_scale = 0.7500000037252903

    [shell.animation]
    enabled = false

    [shell.panel]
    control_center_placement = "floating"

    [shell.screen_corners]
    enabled = true
    size = 4

[theme]
builtin = "Catppuccin"
mode = "auto"

    [theme.templates]
    builtin_ids = [ "ghostty", "niri" ]
    community_ids = [ "yazi" ]

[wallpaper]
directory = "/home/rik/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/rik/Pictures/wallpapers/flexoki.png"

    [wallpaper.last]
    path = "/home/rik/Pictures/wallpapers/flexoki.png"

[weather]
unit = "imperial"

[widget.weather]
latitude = 42.192999999999998
longitude = -73.358999999999995
name = "Great Barrington, MA, USA"
